<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parley</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 16px; background: #111; color: #eee; }
      h1 { font-size: 20px; margin: 0 0 4px; }
      .muted { color: #999; font-size: 13px; }
      .box { border: 1px solid #333; border-radius: 6px; padding: 8px; margin: 10px 0; min-height: 1.4em; }
      #suggestion { border-color: #6c6; color: #9f9; }
      #log { font-family: ui-monospace, monospace; font-size: 12px; color: #aaa; max-height: 40vh; overflow: auto; }
    </style>
  </head>
  <body>
    <h1>Parley</h1>
    <div class="muted"><span id="languages"></span> &middot; phase: <span id="phase">idle</span></div>
    <div id="hud"></div>
    <div class="muted">Transcript</div>
    <div id="transcript" class="box"></div>
    <div class="muted">Suggestion</div>
    <div id="suggestion" class="box"></div>
    <div id="log"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
